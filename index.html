<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOSTI ZONE</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0d1117;
            color: #ffffff;
            margin: 0;
            padding: 0;
            text-align: center;
        }
        header {
            background-color: #161b22;
            padding: 15px;
            border-bottom: 2px solid #ff3155;
        }
        h1 {
            color: #ff3155;
            margin: 0;
            font-size: 24px;
        }
        .nav-menu {
            margin: 10px 0;
            font-size: 14px;
            color: #ff3155;
        }
        .card {
            background: #161b22;
            margin: 15px auto;
            padding: 15px;
            width: 90%;
            max-width: 400px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .btn-whatsapp {
            background-color: #28a745;
            color: white;
            padding: 8px 12px;
            border-radius: 5px;
            text-decoration: none;
            font-weight: bold;
            font-size: 12px;
        }
        .video-box {
            background: #161b22;
            margin: 20px auto;
            padding: 15px;
            width: 90%;
            max-width: 400px;
            border-radius: 8px;
        }
        .video-container {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            overflow: hidden;
            max-width: 100%;
            background: #000;
            border-radius: 6px;
            margin-top: 10px;
        }
        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        .contact-box {
            background: #111528;
            margin: 20px auto;
            padding: 20px;
            width: 90%;
            max-width: 400px;
            border-radius: 8px;
            text-align: left;
        }
        .contact-box input, .contact-box textarea {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            margin-bottom: 15px;
            border-radius: 4px;
            border: none;
            box-sizing: border-box;
        }
        .btn-submit {
            background-color: #ff3155;
            color: white;
            border: none;
            padding: 10px;
            width: 100%;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <header>
        <h1>🎮 DOSTI ZONE</h1>
        <div class="nav-menu">
            HOME | VIDEOS | Dost Call | CONTACT
        </div>
    </header>

    <!-- आपकी शानदार फोटो -->
    <div style="margin-top: 20px;">
        <img src="myphoto.png" alt="मेरा फोटो" style="width: 140px; height: 140px; border-radius: 50%; border: 3px solid #ff3155; object-fit: cover;">
    </div>

    <!-- मित्र 1 -->
    <div class="card">
        <div style="text-align: left;">
            <span style="font-weight: bold;">मित्र 1</span><br>
            <span style="font-size: 12px; color: #aaa;">(यहाँ नाम लिखें)</span>
        </div>
        <a href="#" class="btn-whatsapp">WhatsApp<br>Call</a>
    </div>

    <!-- मित्र 2 -->
    <div class="card">
        <div style="text-align: left;">
            <span style="font-weight: bold;">मित्र 2</span><br>
            <span style="font-size: 12px; color: #aaa;">(यहाँ नाम लिखें)</span>
        </div>
        <a href="#" class="btn-whatsapp">WhatsApp<br>Call</a>
    </div>

    <!-- वीडियो सेक्शन (Gaming Highlights) -->
    <div class="video-box">
        <div style="color: #ff3155; font-weight: bold; margin-bottom: 5px; text-align: left;">Gaming Highlights</div>
        <div class="video-container">
            <iframe src="https://www.youtube.com/embed/dQw4w9WgXcQ" frameborder="0" allowfullscreen></iframe>
        </div>
    </div>

    <!-- Contact Us सेक्शन -->
    <div class="contact-box">
        <h2 style="text-align: center; color: #fff; margin-top: 0;">Contact Us</h2>
        <label style="color: #ff3155; font-size: 14px;">आपका नाम:</label>
        <input type="text" placeholder="नाम लिखें">
        
        <label style="color: #ff3155; font-size: 14px;">आपका संदेश:</label>
        <textarea rows="3" placeholder="अपना संदेश..."></textarea>
        
        <button class="btn-submit">भेजें</button>
    </div>

    <!-- फ्लोटिंग चैट बॉक्स बटन -->
    <div style="position: fixed; bottom: 20px; right: 20px; background-color: #25d366; color: white; width: 55px; height: 55px; border-radius: 50%; display: flex; justify-content: center; align-items: center; box-shadow: 0 4px 8px rgba(0,0,0,0.3); z-index: 1000; font-size: 28px; cursor: pointer;">
        💬
    </div>

</body>
</html>
